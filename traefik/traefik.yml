global:
  sendAnonymousUsage: false
providers:
  swarm:
    exposedByDefault: false
    watch: true
  docker:
    exposedByDefault: false
    watch: true
    network: dokploy-network
  file:
    directory: /etc/dokploy/traefik/dynamic
    watch: true
entryPoints:
  web:
    address: :80
    forwardedHeaders:
      trustedIPs: &trusted_ips
        - "10.0.0.0/8"        # Mempercayai Docker Network internal (Subnet cloudflared Tunnel)
        - "172.16.0.0/12"     # Mempercayai Docker default Bridge range (antisipasi network Docker lain)
        - "192.168.0.0/16"    # Mempercayai IP lokal Proxmox / LAN Anda
        # Cloudflare Public IPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
  websecure:
    address: :443
    forwardedHeaders:
      trustedIPs: *trusted_ips # Menerapkan list tepercaya yang sama untuk port HTTPS/TLS
    http3:
      advertisedPort: 443
    http:
      tls:
        certResolver: letsencrypt
api:
  insecure: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: test@localhost.com
      storage: /etc/dokploy/traefik/dynamic/acme.json
      httpChallenge:
        entryPoint: web
  stepca:
    acme:
      email: test@localhost.com
      caServer: https://acme.lo/acme/de1/directory
      storage: /etc/dokploy/traefik/dynamic/acme-stepca.json
      httpChallenge:
        entryPoint: web
